apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: netlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers: 
        - name: backend-app
          image: nginx
          ports:
            - containerPort: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: netlab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-app
          image: nginx
          ports:
            - containerPort: 80
